name: Noir Vault v2 — Search, Extract & Publish

on:
  workflow_dispatch:
    inputs:
      search_keyword:
        description: 'Keyword Search (e.g. detective, heist, murder, femme fatale)'
        required: false
        default: ''
        type: string
      genre:
        description: 'Genre / Category'
        required: false
        default: 'Film Noir'
        type: choice
        options:
          - 'Film Noir'
          - 'Crime & Gangster'
          - 'Mystery & Suspense'
          - 'Psychological Thriller'
          - 'Western Noir'
          - 'Gothic Horror'
          - 'Sci-Fi B-Movie'
          - 'War & Espionage'
          - 'All Genres'
      date_range:
        description: 'Release Era / Date Range'
        required: false
        default: '1940-1959 (Classic Noir Era)'
        type: choice
        options:
          - '1940-1959 (Classic Noir Era)'
          - '1940-1949 (1940s Golden Age)'
          - '1950-1959 (1950s Late Noir & Cold War)'
          - '1930-1939 (Pre-Code Era)'
          - '1920-1929 (Silent Era)'
          - 'All Eras'
      public_domain_only:
        description: 'Verified Public Domain Only'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      num_movies:
        description: 'Number of movies to process (1–10)'
        required: false
        default: '3'
        type: string
      specific_archive_id:
        description: 'Optional: Force a specific Internet Archive ID'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [run-custom-pipeline]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  search-extract-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Release Tag & Metadata
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d-%H%M')
          RELEASE_TAG="v2-run-${TIMESTAMP}"
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "MOVIE_COUNT=${{ github.event.inputs.num_movies || github.event.client_payload.num_movies || '3' }}" >> $GITHUB_ENV
          echo "RUN_LABEL=${{ github.event.inputs.genre || github.event.client_payload.genre || 'Film Noir' }}" >> $GITHUB_ENV

      - name: Create Base GitHub Release (For Clip Asset Uploads)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Noir Vault v2 | ${{ env.RUN_LABEL }} | ${{ env.MOVIE_COUNT }} Films (${{ env.TIMESTAMP }})"
          body: |
            ## Noir Vault v2 Streamed Extraction Report
            - **Genre:** ${{ github.event.inputs.genre || github.event.client_payload.genre || 'Film Noir' }}
            - **Era:** ${{ github.event.inputs.date_range || github.event.client_payload.date_range || 'All Eras' }}
            - **Keyword:** ${{ github.event.inputs.search_keyword || github.event.client_payload.search_keyword || '(none)' }}
            - **Films requested:** ${{ env.MOVIE_COUNT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Search, Stream & Index Pipeline
        env:
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG:          ${{ env.RELEASE_TAG }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          MODE:                 ${{ github.event.client_payload.mode || 'auto' }}
          SELECTED_MOVIES_JSON: ${{ toJson(github.event.client_payload.movies) }}
          SEARCH_KEYWORD:       ${{ github.event.inputs.search_keyword || github.event.client_payload.search_keyword }}
          SELECTED_GENRE:       ${{ github.event.inputs.genre || github.event.client_payload.genre || 'Film Noir' }}
          DATE_RANGE:           ${{ github.event.inputs.date_range || github.event.client_payload.date_range || '1940-1959 (Classic Noir Era)' }}
          PUBLIC_DOMAIN_ONLY:   ${{ github.event.inputs.public_domain_only || github.event.client_payload.public_domain_only || 'true' }}
          NUM_MOVIES:           ${{ github.event.inputs.num_movies || github.event.client_payload.num_movies || '3' }}
          SCENES_PER_MOVIE:     ${{ github.event.client_payload.scenes_per_movie || '5' }}
          ARCHIVE_ID_OVERRIDE:  ${{ github.event.inputs.specific_archive_id }}
        run: |
          python pipeline.py

      - name: Zip Output Clips (Backup Strategy)
        if: always()
        run: |
          if [ -d "output" ] && [ "$(ls -A output 2>/dev/null)" ]; then
            cd output && zip -r ../output_videos.zip . && cd ..
            echo "Successfully created output_videos.zip"
          else
            echo "No files found in output/ directory to zip."
          fi

      - name: Prepare GitHub Pages Site
        if: always()
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          cp catalog.json _site/catalog.json 2>/dev/null || true
          cp schema.sql _site/ 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload Backup Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-scenes-mp4-backup
          path: output_videos.zip
          if-no-files-found: warn

  deploy-pages:
    needs: search-extract-publish
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
