<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir Vault v2 — Viewer & Control Panel</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181b21;
      --accent: #e50914;
      --text: #e0e6ed;
      --muted: #8c9ba5;
      --border: #2a2e37;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      background-color: #14171d;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; font-size: 1.4rem; color: #fff; }

    .nav-tabs {
      display: flex;
      gap: 1rem;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Control Panel Styles */
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .mode-toggle {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label { font-size: 0.9rem; color: var(--muted); }

    input[type="text"], select, input[type="number"], input[type="password"] {
      background: #0f1115;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

    button.btn-primary {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    button.btn-primary:hover { opacity: 0.9; }

    /* Scene Grid Styles */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .scene-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .scene-card img { width: 100%; height: 160px; object-fit: cover; }
    .scene-info { padding: 1rem; }
    .tag { display: inline-block; background: #2a2e37; font-size: 0.75rem; padding: 2px 6px; border-radius: 3px; margin-right: 4px; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      max-width: 800px;
      width: 90%;
    }

    video { width: 100%; border-radius: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Noir Vault v2</h1>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('viewer')">📺 Clip Vault</button>
      <button class="tab-btn" onclick="switchTab('generator')">🎛 Run Control Panel</button>
    </nav>
  </header>

  <main>
    <!-- TAB 1: CLIP VAULT VIEWER (WITH CATALOG FILTERS) -->
    <div id="viewer-tab" class="tab-content active">
      <h2>Extracted Noir Clips Catalog</h2>
      
      <div class="panel-card">
        <div class="grid-3">
          <div class="form-group">
            <label>Filter Keyword</label>
            <input type="text" id="viewer-search" placeholder="Search title, scene or trope..." oninput="filterCatalog()">
          </div>
          <div class="form-group">
            <label>Genre / Category</label>
            <select id="viewer-genre" onchange="filterCatalog()">
              <option value="All Genres">All Genres</option>
              <option value="Film Noir">Film Noir</option>
              <option value="Crime & Gangster">Crime & Gangster</option>
              <option value="Mystery & Suspense">Mystery & Suspense</option>
              <option value="Psychological Thriller">Psychological Thriller</option>
              <option value="Western Noir">Western Noir</option>
              <option value="Gothic Horror">Gothic Horror</option>
              <option value="Sci-Fi B-Movie">Sci-Fi B-Movie</option>
              <option value="War & Espionage">War & Espionage</option>
            </select>
          </div>
          <div class="form-group">
            <label>Release Era</label>
            <select id="viewer-era" onchange="filterCatalog()">
              <option value="All Eras">All Eras</option>
              <option value="1940-1959">1940-1959 (Classic Noir Era)</option>
              <option value="1940-1949">1940-1949 (1940s Golden Age)</option>
              <option value="1950-1959">1950-1959 (1950s Late Noir)</option>
              <option value="1930-1939">1930-1939 (Pre-Code Era)</option>
              <option value="1920-1929">1920-1929 (Silent Era)</option>
            </select>
          </div>
        </div>
      </div>

      <div id="catalog-container" class="movie-grid">Loading catalog clips…</div>
    </div>

    <!-- TAB 2: INTERACTIVE CONTROL PANEL (FULL PARITY FILTERS) -->
    <div id="generator-tab" class="tab-content">
      <h2>Pipeline Launch Dashboard</h2>
      
      <div class="panel-card">
        <h3>1. Pipeline Execution Mode</h3>
        <div class="mode-toggle">
          <label><input type="radio" name="mode" value="auto" checked onclick="toggleModeUI()"> 🤖 Automatic Mode (Search-based)</label>
          <label><input type="radio" name="mode" value="manual" onclick="toggleModeUI()"> 🎛 Complete Control Mode (Manual Selection)</label>
        </div>
      </div>

      <div class="panel-card">
        <h3>2. Search & Pipeline Parameters</h3>
        <div class="grid-2">
          <div class="form-group">
            <label>Search Keyword</label>
            <input type="text" id="param-keyword" placeholder="e.g. detective, murder, heist, femme fatale">
          </div>
          <div class="form-group">
            <label>Genre / Category</label>
            <select id="param-genre">
              <option value="Film Noir">Film Noir</option>
              <option value="Crime & Gangster">Crime & Gangster</option>
              <option value="Mystery & Suspense">Mystery & Suspense</option>
              <option value="Psychological Thriller">Psychological Thriller</option>
              <option value="Western Noir">Western Noir</option>
              <option value="Gothic Horror">Gothic Horror</option>
              <option value="Sci-Fi B-Movie">Sci-Fi B-Movie</option>
              <option value="War & Espionage">War & Espionage</option>
              <option value="All Genres">All Genres</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Release Era / Date Range</label>
            <select id="param-era">
              <option value="1940-1959 (Classic Noir Era)">1940-1959 (Classic Noir Era)</option>
              <option value="1940-1949 (1940s Golden Age)">1940-1949 (1940s Golden Age)</option>
              <option value="1950-1959 (1950s Late Noir & Cold War)">1950-1959 (1950s Late Noir & Cold War)</option>
              <option value="1930-1939 (Pre-Code Era)">1930-1939 (Pre-Code Era)</option>
              <option value="1920-1929 (Silent Era)">1920-1929 (Silent Era)</option>
              <option value="All Eras">All Eras</option>
            </select>
          </div>
          <div class="form-group">
            <label>Public Domain Only</label>
            <select id="param-pd">
              <option value="true">true (Internet Archive Verified)</option>
              <option value="false">false</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Scenes per Movie (1-10)</label>
            <input type="number" id="param-scenes" value="5" min="1" max="10">
          </div>
          <div class="form-group">
            <label>GitHub Personal Access Token (PAT)</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
          </div>
        </div>
      </div>

      <div id="manual-search-section" class="panel-card" style="display:none;">
        <h3>3. Internet Archive Live Film Picker</h3>
        <button class="btn-primary" onclick="searchInternetArchive()">🔍 Search Internet Archive</button>
        <div id="search-results-list" style="margin-top: 1rem;"></div>
      </div>

      <button class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;" onclick="launchPipelineRun()">🚀 Trigger GitHub Actions Run</button>
    </div>
  </main>

  <!-- VIDEO MODAL -->
  <div id="video-modal" class="modal">
    <div class="modal-content">
      <span style="float:right; cursor:pointer; font-size:1.5rem;" onclick="closeModal()">✕</span>
      <h3 id="modal-title">Scene Viewer</h3>
      <video id="player" controls autoplay></video>
      <p id="modal-desc" style="color:var(--muted); margin-top:1rem;"></p>
      <a id="modal-download" class="btn-primary" style="display:inline-block; text-decoration:none;" download target="_blank">⬇ Download MP4</a>
    </div>
  </div>

  <script>
    let globalCatalogData = null;

    // Tab Switching
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      
      if (tabId === 'viewer') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('viewer-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('generator-tab').classList.add('active');
      }
    }

    function toggleModeUI() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      document.getElementById('manual-search-section').style.display = mode === 'manual' ? 'block' : 'none';
    }

    // Load Catalog JSON for Viewer Tab
    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json');
        globalCatalogData = await res.json();
        renderCatalog(globalCatalogData.movies || []);
      } catch (e) {
        document.getElementById('catalog-container').innerHTML = '<p>No catalog scenes found yet. Run a pipeline to generate clips!</p>';
      }
    }

    function renderCatalog(movies) {
      const container = document.getElementById('catalog-container');
      container.innerHTML = '';

      movies.forEach(movie => {
        (movie.scenes || []).forEach(scene => {
          const card = document.createElement('div');
          card.className = 'scene-card';
          card.innerHTML = `
            <img src="${scene.thumbnail_url || 'https://images.unsplash.com/photo-1509023464722-18d996393ca8?w=640'}" alt="Scene">
            <div class="scene-info">
              <h4>${movie.title} (${movie.year || '?'})</h4>
              <p><strong>Scene ${scene.scene_number}:</strong> ${scene.synopsis || scene.description}</p>
              <div>${(scene.noir_tropes || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
              <button class="btn-primary" style="margin-top:0.8rem; width:100%;" onclick="openPlayer('${scene.download_url}', '${movie.title} - Scene ${scene.scene_number}', '${scene.description}')">▶ Watch MP4</button>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function filterCatalog() {
      if (!globalCatalogData || !globalCatalogData.movies) return;

      const kw = document.getElementById('viewer-search').value.toLowerCase();
      const genre = document.getElementById('viewer-genre').value;
      const era = document.getElementById('viewer-era').value;

      const filtered = globalCatalogData.movies.filter(movie => {
        const matchGenre = (genre === 'All Genres' || movie.genre === genre);
        const matchKw = !kw || movie.title.toLowerCase().includes(kw) || JSON.stringify(movie.scenes).toLowerCase().includes(kw);
        
        let matchEra = true;
        if (era !== 'All Eras' && movie.year) {
          const [start, end] = era.split('-').map(Number);
          matchEra = (movie.year >= start && movie.year <= end);
        }

        return matchGenre && matchKw && matchEra;
      });

      renderCatalog(filtered);
    }

    // Video Player Modal
    function openPlayer(url, title, desc) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('player').src = url;
      document.getElementById('modal-download').href = url;
      document.getElementById('video-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('player').pause();
      document.getElementById('video-modal').style.display = 'none';
    }

    // Search Internet Archive API dynamically
    async function searchInternetArchive() {
      const kw = document.getElementById('param-keyword').value || 'noir';
      const resultsDiv = document.getElementById('search-results-list');
      resultsDiv.innerHTML = 'Searching Internet Archive…';

      const url = `https://archive.org/advancedsearch.php?q=title:(${kw})+AND+mediatype:(movies)&fl[]=identifier,title,year&rows=10&page=1&output=json`;
      const res = await fetch(url);
      const data = await res.json();
      const docs = data.response.docs || [];

      resultsDiv.innerHTML = docs.map(d => `
        <div style="margin-bottom:0.5rem;">
          <label>
            <input type="checkbox" class="movie-select-cb" value="${d.identifier}" data-title="${d.title}">
            <strong>${d.title}</strong> (${d.year || 'N/A'}) [${d.identifier}]
          </label>
        </div>
      `).join('');
    }

    // Trigger GitHub Actions dispatch
    async function launchPipelineRun() {
      const token = document.getElementById('gh-token').value || localStorage.getItem('gh_pat');
      if (!token) {
        alert('Please provide a GitHub PAT token with repo scope.');
        return;
      }
      localStorage.setItem('gh_pat', token);

      const mode = document.querySelector('input[name="mode"]:checked').value;
      const selectedMovies = Array.from(document.querySelectorAll('.movie-select-cb:checked')).map(cb => ({
        id: cb.value,
        title: cb.dataset.title
      }));

      const payload = {
        event_type: 'run-custom-pipeline',
        client_payload: {
          mode: mode,
          search_keyword: document.getElementById('param-keyword').value,
          genre: document.getElementById('param-genre').value,
          date_range: document.getElementById('param-era').value,
          public_domain_only: document.getElementById('param-pd').value,
          num_movies: document.getElementById('param-scenes').value,
          movies: selectedMovies
        }
      };

      const res = await fetch('https://api.github.com/repos/hipster-doofus/noir-vault-v2/dispatches', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('🚀 Workflow dispatched successfully! Clips will appear here once processed.');
      } else {
        alert('❌ Error dispatching workflow. Verify token permissions.');
      }
    }

    loadCatalog();
  </script>
</body>
</html>
